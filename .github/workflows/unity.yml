name: Unity tests and APK

# Needs repository secrets: UNITY_LICENSE (the contents of a .ulf), UNITY_EMAIL and UNITY_PASSWORD.
# Without them every step is skipped. The APK is signed with the runner's debug key: a test build, not a release.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
  UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
  UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

jobs:
  editmode-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        if: env.UNITY_LICENSE != ''
      - uses: actions/cache@v4
        if: env.UNITY_LICENSE != ''
        with:
          path: Library
          key: Library-tests-${{ hashFiles('Packages/packages-lock.json') }}
      - uses: game-ci/unity-test-runner@v4
        if: env.UNITY_LICENSE != ''
        with:
          unityVersion: 6000.3.25f1
          testMode: editmode
          githubToken: ${{ secrets.GITHUB_TOKEN }}

  apk:
    needs: editmode-tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        if: env.UNITY_LICENSE != ''
        with:
          fetch-depth: 0   # the version code is the commit count
      - uses: actions/cache@v4
        if: env.UNITY_LICENSE != ''
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Packages/packages-lock.json') }}
      - uses: game-ci/unity-builder@v4
        if: env.UNITY_LICENSE != ''
        with:
          unityVersion: 6000.3.25f1
          targetPlatform: Android
          buildMethod: BuildNavigateScene.BuildApk
      - uses: actions/upload-artifact@v4
        if: env.UNITY_LICENSE != ''
        with:
          name: Doorway-apk
          path: Builds/BuildingNav-Navigate.apk
          if-no-files-found: error
